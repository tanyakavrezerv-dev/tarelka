<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Калькулятор кадастрового инженера</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--ink:#17212b;--muted:#5f6b76;--line:#d7dde3;--accent:#1769aa;--soft:#e8f2fb;--bad:#a12622;--good:#18794e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.top h1{margin:0 0 6px;font-size:clamp(22px,4vw,32px)}.badge{background:#fff0c2;color:#6b4f00;padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 13px;border-radius:8px;cursor:pointer}.tabs button.active,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.card h2{margin:0 0 12px;font-size:19px}.field{display:grid;gap:5px;margin:9px 0}.field input,.field textarea,.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit}.field textarea{min-height:110px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hint,.muted{color:var(--muted);font-size:14px}.error{color:var(--bad);font-weight:600;min-height:20px;margin-top:6px}.result{margin-top:12px;padding:12px;background:var(--soft);border-radius:8px;white-space:pre-wrap;overflow:auto}.result table{border-collapse:collapse;width:100%;white-space:nowrap}.result th,.result td{border:1px solid var(--line);padding:6px;text-align:right}.result th:first-child,.result td:first-child{text-align:left}.warn{color:var(--bad);font-weight:700}.ok{color:var(--good);font-weight:700}footer{margin-top:28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}@media(max-width:640px){main{padding:12px}.top{display:block}.badge{display:inline-block;margin-top:10px}.result{font-size:14px}}
</style></head><body><main>
<header class="top"><div><h1>Калькулятор кадастрового инженера</h1><div class="muted">Офлайн инструмент вспомогательных расчётов</div></div><div class="badge" id="badge"></div></header>
<nav class="tabs" id="tabs"></nav><section id="tools" class="panel active"></section><section id="self" class="panel"></section><section id="formulas" class="panel"></section><section id="history" class="panel"></section>
<footer id="foot"></footer></main>
<script>
'use strict';
const VERSION='1.0.0',BUILD='16.10.2026',BADGE='Тестовая версия, формулы на проверке';
const $=id=>document.getElementById(id), el=(tag,attrs={},children=[])=>{const n=document.createElement(tag);Object.keys(attrs).forEach(k=>{if(k==='text')n.textContent=attrs[k];else if(k==='class')n.className=attrs[k];else if(k.startsWith('on'))n.addEventListener(k.slice(2),attrs[k]);else n.setAttribute(k,attrs[k])});children.forEach(c=>n.append(c));return n};
const text=v=>String(v).replace(/\u00a0/g,' ').trim(), num=v=>{let s=text(v).replace(/\s/g,'').replace(',','.');return s===''?NaN:Number(s)}, fmt=(v,d=3)=>Number(v).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
function parsePoints(s){const out=[],lines=text(s).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(let i=0;i<lines.length;i++){let a=lines[i].replace(/;/g,' ').split(/[\s,]+/).filter(Boolean),name='';if(a.length===3){name=a[0];a=a.slice(1)}if(a.length!==2||!Number.isFinite(num(a[0]))||!Number.isFinite(num(a[1])))throw Error('Строка '+(i+1)+': ожидаются X Y или имя X Y');out.push({name:name||String(i+1),x:num(a[0]),y:num(a[1])})}if(out.length<3)throw Error('Нужно минимум 3 точки');if(out.length>3&&out[0].x===out.at(-1).x&&out[0].y===out.at(-1).y)out.pop();return out}
function angleDMS(a){a=((a%360)+360)%360;let sec=Math.round(a*3600*10)/10,d=Math.floor(sec/3600);sec-=d*3600;let m=Math.floor(sec/60);sec=Math.round((sec-m*60)*10)/10;if(sec>=60){sec=0;m++}if(m>=60){m=0;d=(d+1)%360}return `${d}°${String(m).padStart(2,'0')}′${sec.toFixed(1).padStart(4,'0')}″`}
function parseAngle(v){let s=text(v).replace(/,/g,'.');if(/[°′″'\s]/.test(s)){let a=s.match(/[-+]?\d+(?:\.\d+)?/g)||[];if(a.length===3)return num(a[0])+num(a[1])/60+num(a[2])/3600;if(a.length===2)return num(a[0])+num(a[1])/60}return num(s)}
function segInt(a,b,c,d){const cross=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x),o1=cross(a,b,c),o2=cross(a,b,d),o3=cross(c,d,a),o4=cross(c,d,b);return ((o1>0&&o2<0)||(o1<0&&o2>0))&&((o3>0&&o4<0)||(o3<0&&o4>0))}
function polygon(ps){let area=0,per=0;for(let i=0;i<ps.length;i++){let a=ps[i],b=ps[(i+1)%ps.length];area+=a.x*b.y-b.x*a.y;per+=Math.hypot(b.x-a.x,b.y-a.y)}let cross=false;for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){if(j===i+1||(i===0&&j===ps.length-1))continue;if(segInt(ps[i],ps[(i+1)%ps.length],ps[j],ps[(j+1)%ps.length]))cross=true}return{area:Math.abs(area)/2,per,cross}}
function saveHistory(item){try{let h=JSON.parse(localStorage.getItem('inzhener-history')||'[]');h.unshift(item);localStorage.setItem('inzhener-history',JSON.stringify(h.slice(0,20)))}catch(e){}}
function protocol(title,input,result,formula){let w=window.open('','_blank');if(!w)return;let d=new Date().toLocaleString('ru-RU');w.document.write('<!doctype html><meta charset="utf-8"><title>Протокол</title><style>body{font:16px Arial;max-width:800px;margin:30px}pre{white-space:pre-wrap}h1{font-size:24px}</style><h1>'+title+'</h1><p>'+d+'</p><h2>Исходные данные</h2><pre>'+input+'</pre><h2>Результат</h2><pre>'+result+'</pre><h2>Формула</h2><pre>'+formula+'</pre><p>Версия программы: '+VERSION+' от '+BUILD+'</p><p>Расчёт выполнен вспомогательным инструментом и требует проверки инженером</p><p>Проверил: ____________________</p>');w.document.close();w.print()}
function card(title){return el('article',{class:'card'},[el('h2',{text:title})])}function addField(c,label,id,attrs={}){let i=el('input',Object.assign({id},attrs));c.append(el('label',{class:'field'},[el('span',{text:label}),i]));return i}
function toolCard(title,build){let c=card(title);build(c);$('tools').append(c);return c}
function controls(c,run,example,clear,getResult,formula){let a=el('div',{class:'actions'});a.append(el('button',{class:'btn primary',text:'Рассчитать',onclick:run}),el('button',{class:'btn',text:'Пример',onclick:example}),el('button',{class:'btn',text:'Очистить',onclick:clear}),el('button',{class:'btn',text:'Копировать результат',onclick:()=>navigator.clipboard?.writeText(getResult()?.textContent||'')}),el('button',{class:'btn',text:'Сохранить протокол',onclick:()=>{let r=getResult();if(r)protocol(titleFrom(c),'См. поля инструмента',r.textContent,formula)}}));c.append(a)}
function titleFrom(c){return c.querySelector('h2').textContent}
function areaTool(){let c=toolCard('Площадь и периметр по координатам',c=>{let p=el('textarea',{id:'ptsArea',placeholder:'Точка 1 500000 2200000\nТочка 2 500000 2200100\nТочка 3 500100 2200100'});c.append(el('label',{class:'field'},[el('span',{text:'Точки'}),p]));let round=el('input',{type:'checkbox',id:'roundArea'});c.append(el('label',{class:'row'},[round,el('span',{text:'округлить площадь до 1 м²'})]));let err=el('div',{class:'error'}),res=el('div',{class:'result'});c.append(err,res);let run=()=>{try{let q=polygon(parsePoints(p.value));let a=round.checked?Math.round(q.area):q.area;res.textContent=`Точек: ${parsePoints(p.value).length}\nПлощадь: ${fmt(a,2)} м²\nПлощадь: ${fmt(a/10000,4)} га\nПериметр: ${fmt(q.per,3)} м`+(q.cross?'\n⚠ Контур самопересекается, площадь по формуле Гаусса не подходит':'');err.textContent='';saveHistory({tool:titleFrom(c),result:res.textContent,date:new Date().toLocaleString('ru-RU')})}catch(e){err.textContent=e.message;res.textContent=''}};controls(c,run,()=>{p.value='500000 2200000\n500000 2200100\n500100 2200100\n500100 2200000'},()=>{p.value='';res.textContent=''},()=>res,'Формула Гаусса: S = 1/2 × |Σ(xᵢyᵢ₊₁ - xᵢ₊₁yᵢ)|')})}
function bearingTool(){let c=toolCard('Ведомость: расстояния и дирекционные углы',c=>{let p=el('textarea',{id:'ptsBear',placeholder:'X Y'});c.append(el('label',{class:'field'},[el('span',{text:'Точки'}),p]));let res=el('div',{class:'result'});c.append(res);let run=()=>{try{let ps=parsePoints(p.value),t=el('table'),head=el('tr');['От','До','ΔX','ΔY','Расстояние','Угол','Десятичный'].forEach(x=>head.append(el('th',{text:x})));t.append(head);for(let i=0;i<ps.length;i++){let a=ps[i],b=ps[(i+1)%ps.length],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),ang=(Math.atan2(dy,dx)*180/Math.PI+360)%360,tr=el('tr');[a.name,b.name,fmt(dx),fmt(dy),fmt(d),angleDMS(ang),fmt(ang,6)].forEach(x=>tr.append(el('td',{text:x})));t.append(tr)}res.replaceChildren(t);saveHistory({tool:titleFrom(c),result:'Ведомость рассчитана',date:new Date().toLocaleString('ru-RU')})}catch(e){res.textContent=e.message}};controls(c,run,()=>{p.value='0 0\n0 100\n100 100\n100 0'},()=>{p.value='';res.textContent=''},()=>res,'d = √(ΔX² + ΔY²), α = atan2(ΔY, ΔX)')})}
function inverseTool(){let c=toolCard('Обратная геодезическая задача',c=>{let xs=['X1','Y1','X2','Y2'].map(x=>addField(c,x,x,{type:'text'})),res=el('div',{class:'result'});c.append(res);let run=()=>{let a=xs.map(x=>num(x.value));if(a.some(Number.isNaN)){res.textContent='Ошибка: заполните все поля';return}let dx=a[2]-a[0],dy=a[3]-a[1],d=Math.hypot(dx,dy);if(!d){res.textContent='Точки совпадают';return}let an=(Math.atan2(dy,dx)*180/Math.PI+360)%360;res.textContent=`ΔX: ${fmt(dx)}\nΔY: ${fmt(dy)}\nРасстояние: ${fmt(d)} м\nУгол: ${angleDMS(an)} (${fmt(an,6)}°)`;saveHistory({tool:titleFrom(c),result:res.textContent,date:new Date().toLocaleString('ru-RU')})};controls(c,run,()=>{[0,0,0,100].forEach((v,i)=>xs[i].value=v)},()=>xs.forEach(x=>x.value=''),()=>res,'d = √(ΔX² + ΔY²), α = atan2(ΔY, ΔX)')})}
function directTool(){let c=toolCard('Прямая геодезическая задача',c=>{let xs=['X1','Y1','Расстояние d','Угол α'].map((x,i)=>addField(c,x,'dir'+i,{type:'text'})),res=el('div',{class:'result'});c.append(res);let run=()=>{let x=num(xs[0].value),y=num(xs[1].value),d=num(xs[2].value),a=parseAngle(xs[3].value);if([x,y,d,a].some(Number.isNaN)||d<0){res.textContent='Ошибка: проверьте ввод';return}let r=a*Math.PI/180;res.textContent=`X2: ${fmt(x+d*Math.cos(r))}\nY2: ${fmt(y+d*Math.sin(r))}`;saveHistory({tool:titleFrom(c),result:res.textContent,date:new Date().toLocaleString('ru-RU')})};controls(c,run,()=>{[1000,2000,100,90].forEach((v,i)=>xs[i].value=v)},()=>xs.forEach(x=>x.value=''),()=>res,'X2 = X1 + d cos α; Y2 = Y1 + d sin α')})}
function angleTool(){let c=toolCard('Угол: градусы, минуты, секунды и десятичные градусы',c=>{let dec=addField(c,'Десятичные градусы','angleDec',{type:'text'}),d=addField(c,'Градусы','angleD',{type:'text'}),m=addField(c,'Минуты','angleM',{type:'text'}),s=addField(c,'Секунды','angleS',{type:'text'}),res=el('div',{class:'result'});c.append(res);let run=()=>{if(text(dec.value)){let a=parseAngle(dec.value);if(Number.isNaN(a)){res.textContent='Ошибка';return}res.textContent=`${angleDMS(a)}\nДесятичные: ${fmt(((a%360)+360)%360,5)}°`}else{let a=num(d.value)+num(m.value)/60+num(s.value)/3600;res.textContent=Number.isNaN(a)?'Ошибка':`${fmt(((a%360)+360)%360,5)}°`}};controls(c,run,()=>{dec.value='57.995'},()=>{[dec,d,m,s].forEach(x=>x.value='')},()=>res,'Перевод единиц: градусы + минуты/60 + секунды/3600')})}
function errorTool(){let c=toolCard('Предельная погрешность площади',c=>{let mt=addField(c,'Mt, м','mt',{type:'text'}),p=addField(c,'Площадь участка P, м²','pArea',{type:'text'}),e=addField(c,'Площадь по ЕГРН, м² (необязательно)','pEgrn',{type:'text'}),m=addField(c,'Площадь по замерам, м² (необязательно)','pMeas',{type:'text'}),res=el('div',{class:'result'});c.append(res);let run=()=>{let a=num(mt.value),b=num(p.value);if([a,b].some(Number.isNaN)||a<0||b<0){res.textContent='Ошибка: проверьте Mt и P';return}let lim=3.5*a*Math.sqrt(b);res.textContent=`Предельная погрешность ΔP: ${fmt(lim,3)} м²`;if(text(e.value)&&text(m.value)){let diff=Math.abs(num(e.value)-num(m.value));res.textContent+=`\nРасхождение: ${fmt(diff,3)} м²\nСтатус: ${diff<=lim?'в пределах ΔP':'превышает ΔP'}`}};controls(c,run,()=>{mt.value='0.1';p.value='1000'},()=>[mt,p,e,m].forEach(x=>x.value=''),()=>res,'ΔP = 3,5 × Mt × √P')})}
function convertTool(){let c=toolCard('Конвертер площади',c=>{let v=addField(c,'Значение','convVal',{type:'text'}),u=el('select',{id:'convUnit'});['м²','сотки','га','км²'].forEach(x=>u.append(el('option',{text:x})));c.append(el('label',{class:'field'},[el('span',{text:'Единица'}),u]));let res=el('div',{class:'result'});c.append(res);let run=()=>{let n=num(v.value),k=[1,100,10000,1e6][u.selectedIndex];if(Number.isNaN(n)){res.textContent='Ошибка';return}let m=n*k;res.textContent=`м²: ${fmt(m,2)}\nсотки: ${fmt(m/100,4)}\nга: ${fmt(m/10000,6)}\nкм²: ${fmt(m/1e6,8)}`};controls(c,run,()=>{v.value='1';u.selectedIndex=2},()=>{v.value='';res.textContent=''},()=>res,'1 сотка = 100 м²; 1 га = 10 000 м²')})}
function selfTests(){let rows=[],ok=(name,exp,got,tol)=>rows.push({name,exp,got,status:Math.abs(exp-got)<=tol});let q=polygon([{x:0,y:0},{x:0,y:100},{x:100,y:100},{x:100,y:0}]);ok('квадрат площадь',10000,q.area,.01);ok('квадрат периметр',400,q.per,.001);let tr=polygon([{x:0,y:0},{x:0,y:30},{x:40,y:0}]);ok('треугольник площадь',600,tr.area,.01);ok('треугольник периметр',120,tr.per,.001);ok('обратная 0,100',90,(Math.atan2(100,0)*180/Math.PI+360)%360,.1/3600);ok('ΔP',11.06797181,3.5*.1*Math.sqrt(1000),.001);return rows}
function init(){ $('badge').textContent=BADGE;[['tools','Инструменты'],['self','Самопроверка'],['formulas','Формулы и статус'],['history','История']].forEach(([id,label],i)=>{let b=el('button',{text:label,onclick:()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main>section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='history')renderHistory()}});if(i===0)b.classList.add('active');$('tabs').append(b)});areaTool();bearingTool();inverseTool();directTool();angleTool();errorTool();convertTool();let sc=card('Проверка эталонных примеров');sc.append(el('p',{text:'Допуски: длины 0,001 м, площади 0,01 м², углы 0,1″.'}));let sr=el('div',{class:'result'});sc.append(el('button',{class:'btn primary',text:'Запустить все тесты',onclick:()=>{let r=selfTests(),good=r.filter(x=>x.status).length;sr.textContent=r.map(x=>`${x.name}: ожидалось ${x.exp}, получено ${x.got}, статус ${x.status?'OK':'ОШИБКА'}`).join('\n')+`\nИтог: ${good} из ${r.length}`}}),sr);$('self').append(sc);let fc=card('Статусы формул');[['Площадь','Формула Гаусса','не проверено инженером'],['Длины и углы','atan2 и евклидово расстояние','не проверено инженером'],['Предельная погрешность площади','ΔP = 3,5 × Mt × √P','не проверено инженером'],['Конвертер площади','1 га = 10 000 м²','не проверено инженером']].forEach(r=>{let p=el('p');p.append(el('b',{text:r[0]+': '}),el('span',{text:r[1]+' - '+r[2]}));fc.append(p)});$('formulas').append(fc);$('foot').textContent=`Версия ${VERSION}, сборка ${BUILD}. Данные не покидают компьютер.`}
function renderHistory(){let h;try{h=JSON.parse(localStorage.getItem('inzhener-history')||'[]')}catch(e){h=[]}let c=card('Последние расчёты');c.append(el('button',{class:'btn',text:'Очистить историю',onclick:()=>{try{localStorage.removeItem('inzhener-history')}catch(e){}renderHistory()}}));h.forEach(x=>c.append(el('p',{text:`${x.date} - ${x.tool}\n${x.result}`})));$('history').replaceChildren(c)}
init();
</script></main></body></html>
